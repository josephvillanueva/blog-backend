# PostgreSQL. Connection settings come from the standard PG* variables, with
# local defaults. In production, set DATABASE_URL instead.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "localhost") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>

development:
  <<: *default
  database: blog_backend_development

test:
  <<: *default
  database: blog_backend_test

production:
  <<: *default
  database: blog_backend_production
