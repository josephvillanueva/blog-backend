<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 652" width="1160" height="652" role="img" aria-labelledby="t"><title id="t">Blog Backend architecture</title><style>svg{--bg:#ffffff;--zone:#f5f6f8;--zoneStroke:#d5d9e0;--zoneLabel:#0a6fb8;--node:#ffffff;--nodeStroke:#c4cad3;--title:#111827;--text:#4b5563;--edge:#6b7280;--edgeText:#374151;--accent:#0a84d6;--pill:#ffffff;}@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--zone:#151a23;--zoneStroke:#2a313d;--zoneLabel:#4db5ff;--node:#1b212c;--nodeStroke:#363e4c;--title:#f3f4f6;--text:#a4acb9;--edge:#8a93a2;--edgeText:#d1d5db;--accent:#4db5ff;--pill:#0f1218;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.zone{fill:var(--zone);stroke:var(--zoneStroke);stroke-width:1;stroke-dasharray:5 4}
.zlabel{fill:var(--zoneLabel);font-size:12px;font-weight:700;letter-spacing:.08em}
.zsub{fill:var(--text);font-size:12px}
.node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
.node.key{stroke:var(--accent);stroke-width:2}
.bar{fill:var(--accent)}
.ntitle{fill:var(--title);font-size:14px;font-weight:600}
.ntext{fill:var(--text);font-size:12px}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.alt{stroke-dasharray:6 4}
.head{fill:var(--edge)}
.pill{fill:var(--pill);stroke:var(--zoneStroke);stroke-width:1}
.elabel{fill:var(--edgeText);font-size:11.5px}
.legend{fill:var(--text);font-size:12px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1160" height="652" rx="14"/><rect class="zone" x="16" y="16" width="230" height="424" rx="12"/><text class="zlabel" x="36" y="46">CLIENT</text><text class="zsub" x="36" y="66">Any HTTP client</text><rect class="zone" x="266" y="16" width="660" height="424" rx="12"/><text class="zlabel" x="286" y="46">RAILS 7.2 API</text><text class="zsub" x="286" y="66">JSON only, no views</text><rect class="zone" x="946" y="16" width="198" height="424" rx="12"/><text class="zlabel" x="966" y="46">DATA</text><rect class="zone" x="16" y="464" width="1128" height="140" rx="12"/><text class="zlabel" x="36" y="494">CI</text><text class="zsub" x="36" y="514">GitHub Actions on every pull request</text><path class="edge" d="M226,147 L290,147" marker-end="url(#arrow)"/><path class="edge" d="M560,147 L584.7,147 Q585,147 585,146.7 L585,146.7 Q585,146.4 585.3,146.4 L610,146.4" marker-end="url(#arrow)"/><path class="edge" d="M639,201 L639,240 Q639,250 629,250 L435,250 Q425,250 425,260 L425,300" marker-end="url(#arrow)"/><path class="edge" d="M813,201 L813,300" marker-end="url(#arrow)"/><path class="edge" d="M900,337 L962,337" marker-end="url(#arrow)"/><rect class="node" x="36" y="110" width="190" height="74" rx="10"/><text class="ntitle" x="52" y="137">Web or mobile app</text><text class="ntext" x="52" y="158">Sends a Bearer token</text><text class="ntext" x="52" y="175">after logging in</text><rect class="node" x="290" y="110" width="270" height="74" rx="10"/><text class="ntitle" x="306" y="137">Routes</text><text class="ntext" x="306" y="158">/users, /login, /blogs,</text><text class="ntext" x="306" y="175">nested comments and vote</text><rect class="node key" x="610" y="110" width="290" height="91" rx="10"/><text class="ntitle" x="626" y="137">Controllers</text><text class="ntext" x="626" y="158">authorize! before actions,</text><text class="ntext" x="626" y="175">ownership checks,</text><text class="ntext" x="626" y="192">401 / 403 / 404 / 422 errors</text><rect class="node" x="290" y="300" width="270" height="74" rx="10"/><text class="ntitle" x="306" y="327">AuthToken (JWT)</text><text class="ntext" x="306" y="348">HS256, expires in 24 hours</text><text class="ntext" x="306" y="365">Secret from JWT_SECRET</text><rect class="node" x="610" y="300" width="290" height="74" rx="10"/><text class="ntitle" x="626" y="327">Models</text><text class="ntext" x="626" y="348">User, Blog, Comment, Vote</text><text class="ntext" x="626" y="365">Validations, draft visibility</text><rect class="node" x="962" y="300" width="166" height="74" rx="10"/><rect class="bar" x="962" y="312" width="3" height="50" rx="1.5"/><text class="ntitle" x="978" y="327">PostgreSQL</text><text class="ntext" x="978" y="348">One vote per user</text><text class="ntext" x="978" y="365">and post</text><rect class="node" x="400" y="510" width="380" height="74" rx="10"/><text class="ntitle" x="416" y="537">Migrate, check schema, test</text><text class="ntext" x="416" y="558">36 integration and model tests</text><text class="ntext" x="416" y="575">against Postgres 16</text><rect class="pill" x="226.24" y="130" width="63.52" height="34" rx="5"/><text class="elabel" x="258" y="144" text-anchor="middle">JSON</text><text class="elabel" x="258" y="158" text-anchor="middle">requests</text><rect class="pill" x="540.74" y="137" width="63.52" height="20" rx="5"/><text class="elabel" x="572.5" y="151" text-anchor="middle">dispatch</text><rect class="pill" x="506.68" y="233" width="50.64" height="34" rx="5"/><text class="elabel" x="532" y="247" text-anchor="middle">verify</text><text class="elabel" x="532" y="261" text-anchor="middle">token</text><rect class="pill" x="784.46" y="233.5" width="57.080000000000005" height="34" rx="5"/><text class="elabel" x="813" y="247.5" text-anchor="middle">scoped</text><text class="elabel" x="813" y="261.5" text-anchor="middle">queries</text><rect class="pill" x="915.34" y="327" width="31.32" height="20" rx="5"/><text class="elabel" x="931" y="341" text-anchor="middle">SQL</text><path class="edge" d="M36,626 L70,626" marker-end="url(#arrow)"/><text class="legend" x="80" y="630">Call or request (responses return the same way)</text><rect class="node key" x="425.84000000000003" y="618" width="22" height="16" rx="4"/><text class="legend" x="455.84000000000003" y="630">Core logic</text><rect class="node" x="553.0400000000001" y="618" width="22" height="16" rx="4"/><rect class="bar" x="553.0400000000001" y="621" width="3" height="10" rx="1.5"/><text class="legend" x="583.0400000000001" y="630">Persisted state</text></svg>
